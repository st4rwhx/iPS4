name: iOS build spike

# Second attempt, informed by real evidence from the first run (see git history
# for run 1's findings) plus a working reference pipeline for the same class of
# problem: margooey/Madeira-actions (Wine+FEX-Emu+DXMT on iOS) builds FEXCore,
# native libs, and links into an Xcode app via unsigned xcodebuild + zip, all
# with small, independent per-library scripts rather than one monolithic CMake
# super-build. This run validates the two highest-confidence, foundational
# pieces of that pattern before building on top of them in a follow-up:
#
#   1. Build runtime/sources/fexcore-darwin standalone (it has its own real
#      project(FEX C CXX ASM) CMakeLists.txt -- confirmed by direct read --
#      unlike the repo's own top-level CMakeLists.txt, which turned out to be
#      a misplaced duplicate of externals/CMakeLists.txt, not the real project
#      root; see run 1's CMake errors). BUILD_FEXCORE_ONLY=ON,
#      CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY (missing from run 1 --
#      without it CMake's compiler check tries to link an executable, which
#      doesn't work when cross-compiling to iOS).
#   2. Build externals/ (already content-correct for iOS per direct diff
#      against upstream shadps4-emu/shadPS4's externals/CMakeLists.txt --
#      just needs a tiny project()/cmake_minimum_required() wrapper it doesn't
#      have on its own) for spdlog/fmt/zlib/freetype/glslang/etc.
#
# NOT yet in this run, deliberately -- these depend on stages 1-2 actually
# succeeding first, and are more speculative (worth their own iteration once
# 1-2 are confirmed working, rather than compounding uncertainty in one shot):
#
#   3. Glob-build a shadps4_ios static library from src/, since the exact
#      curated file list the real (missing) root CMakeLists.txt would have
#      used isn't recoverable -- trading exact upstream parity for a
#      pragmatic working build. Would exclude src/platform/bachata
#      (Android-only) and define SHADPS4_ENABLE_FEX_GUEST_CPU.
#   4. xcodebuild (unsigned, CODE_SIGNING_ALLOWED=NO, matching
#      runtime/scripts/build-ipa.sh) against the now-portable .pbxproj (its
#      hardcoded /Users/davi/... absolute paths were fixed to $(SRCROOT)/..
#      in a separate commit) + package IPA.
#
# Still a spike: continue-on-error per stage, everything logged and uploaded
# regardless of where it stops, so a red run still hands back the exact next
# thing to fix. Also fixing a real bug from run 1: its "configure_exit"
# variable was captured but never acted on, so a genuinely failing CMake
# configure was reported as a successful step -- every configure/build step
# here now does `exit "${PIPESTATUS[0]}"` so a real failure actually fails
# the step (and, via continue-on-error, the job keeps going and still
# uploads logs -- but the step's own status is now honest).

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write

env:
  IOS_DEPLOYMENT_TARGET: "18.0"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show runner environment
        run: |
          sw_vers || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          cmake --version || true

      - name: Install build tools
        run: |
          brew update || true
          for i in 1 2 3; do
            brew install ninja && break
            echo "brew install attempt $i failed; retrying in $((i*5))s"; sleep $((i*5))
          done
          command -v ninja >/dev/null || { echo "::error::ninja missing after retries"; exit 1; }

      # ==============================================================
      # STAGE 1: FEXCore, standalone. Flags mirror Madeira-actions'
      # working FEX build (margooey/Madeira-actions/.github/workflows/main.yml)
      # as closely as this fork's own runtime/sources/fexcore-darwin/CMakeLists.txt
      # options allow (it exposes the same BUILD_FEXCORE_ONLY option Madeira's
      # FEX fork does, plus FEXCORE_PROJECT_SOURCE_DIR/FEXCORE_GUEST_HARNESS_SOURCES
      # for embedding this app's own guest-CPU bridge, per its own README).
      # ==============================================================
      - name: Configure FEXCore (standalone)
        id: fexconfigure
        continue-on-error: true
        run: |
          set -x
          cmake -S runtime/sources/fexcore-darwin -B runtime/build/fexcore-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_FEXCORE_ONLY=ON \
            -DFEXCORE_SMOKE_SOURCE="$PWD/runtime/probes/fexcore-smoke.cpp" \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEXCORE_PROFILER=OFF \
            -DTUNE_CPU=none \
            2>&1 | tee spike-fex-configure.log
          exit "${PIPESTATUS[0]}"

      - name: Build FEXCore
        id: fexbuild
        if: steps.fexconfigure.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          cmake --build runtime/build/fexcore-ios --target FEXCore FEXCore_Base \
            --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee spike-fex-build.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize FEXCore stage
        if: always()
        run: |
          echo "### FEXCore (standalone)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 spike-fex-configure.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "error:|FAILED" spike-fex-build.log 2>/dev/null | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find runtime/build/fexcore-ios -name "libFEXCore*.a" 2>/dev/null | tee spike-fex-libs.txt

      # ==============================================================
      # STAGE 2: externals/ (spdlog, fmt, zlib, freetype, glslang, openal,
      # etc.) -- content-correct for iOS already (confirmed by diff against
      # upstream shadps4-emu/shadPS4's externals/CMakeLists.txt), just needs
      # a real project() it doesn't have on its own account of being an
      # add_subdirectory()-only file.
      # ==============================================================
      - name: Wrap externals/ with a real project()
        run: |
          mkdir -p spike-wrapper
          cat > spike-wrapper/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(shadps4_ios_externals CXX C ASM)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED True)
          set(ENABLE_DISCORD_RPC OFF CACHE BOOL "" FORCE)
          set(ENABLE_TESTS OFF CACHE BOOL "" FORCE)
          set(ENABLE_UPDATER OFF CACHE BOOL "" FORCE)
          # externals/ffmpeg-core/CMakeLists.txt reads ARCHITECTURE, which upstream
          # shadps4-emu/shadPS4's real root CMakeLists.txt computes (from
          # CMAKE_OSX_ARCHITECTURES/CMAKE_SYSTEM_PROCESSOR) before add_subdirectory
          # (externals) -- this wrapper is standing in for that missing root file,
          # so it needs to set the same variable the same way. iOS is always arm64
          # here, so the general detection logic isn't needed, just the result.
          set(ARCHITECTURE "arm64")
          # externals/CMakeLists.txt uses relative add_subdirectory() calls (e.g.
          # add_subdirectory(spdlog)) resolved against ITS OWN directory, not the
          # wrapper's -- add_subdirectory (not include()) is what makes CMake
          # resolve those correctly, since it changes CMAKE_CURRENT_SOURCE_DIR.
          add_subdirectory("${CMAKE_CURRENT_SOURCE_DIR}/../externals" externals-build)
          EOF

      - name: Configure externals
        id: extconfigure
        continue-on-error: true
        run: |
          set -x
          cmake -S spike-wrapper -B runtime/build/shadps4-ios/externals -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=1 \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE__TRYRUN_OUTPUT= \
            2>&1 | tee spike-externals-configure.log
          exit "${PIPESTATUS[0]}"

      - name: Build externals
        id: extbuild
        if: steps.extconfigure.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          cmake --build runtime/build/shadps4-ios/externals \
            --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee spike-externals-build.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize externals stage
        if: always()
        run: |
          echo "### externals/" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 spike-externals-configure.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "error:|FAILED" spike-externals-build.log 2>/dev/null | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find runtime/build/shadps4-ios/externals -name "*.a" 2>/dev/null | sort | tee spike-externals-libs.txt

      - name: Upload ALL spike logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-spike-logs
          path: |
            spike-*.log
            spike-*.txt
          if-no-files-found: warn

      - name: Upload FEXCore libs (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fexcore-ios-libs
          path: |
            runtime/build/fexcore-ios/**/libFEXCore*.a
          if-no-files-found: warn
