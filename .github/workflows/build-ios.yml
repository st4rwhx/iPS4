name: iOS build spike

# This repo (a fork of leviidev/aetherps4) has NO existing CI for its iOS target, no
# BUILDING.md, and its top-level CMakeLists.txt has no `project()` call of its own -- the
# AetherPS4-iOS.xcodeproj checked into the repo links ~20 separately pre-built static
# libraries (libshadps4_ios.a, libglslang.a, libspdlog.a, libfmt.a, libz.a, libfreetype.a,
# libopenal.a, libZycore.a, libZydis.a, libsoftfloat_3e.a, libfdk-aac.a, six libhwinfo_*.a,
# libminiupnpc.a, ...) that must already exist at fixed LIBRARY_SEARCH_PATHS locations before
# xcodebuild can link. There is no discoverable script that builds all of those from a clean
# checkout, so this workflow is a genuine first attempt, not a known-good recipe being
# replayed -- exactly the situation AYS3's own phase1 spike started from. Expected to fail
# somewhere on the first few runs; the logs are the deliverable each time, driving the next
# fix. continue-on-error + exhaustive logging throughout so a failure still tells us exactly
# where and why, instead of just "red job".

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Show runner environment
        run: |
          sw_vers || true
          uname -a
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          cmake --version || true
          ruby --version || true
          sysctl -n hw.memsize | awk '{printf "RAM: %.1f GB\n", $1/1024/1024/1024}'

      - name: Install build tools
        run: |
          brew update || true
          for i in 1 2 3; do
            brew install ninja && break
            echo "brew install attempt $i failed; retrying in $((i*5))s"; sleep $((i*5))
          done
          command -v ninja >/dev/null || { echo "::error::ninja missing after retries"; exit 1; }
          gem list xcodeproj -i || gem install xcodeproj --no-document

      - name: List submodule status (diagnostic)
        if: always()
        run: |
          git submodule status --recursive | tee spike-submodules.txt | head -80
          echo "--- total submodules ---"
          git submodule status --recursive | wc -l

      - name: CMake configure for arm64-apple-ios
        id: configure
        continue-on-error: true
        run: |
          set -x
          mkdir -p runtime/build/shadps4-ios-arm64
          cmake -S . -B runtime/build/shadps4-ios-arm64 \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=18.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DENABLE_SYSTEM_VULKAN=OFF \
            2>&1 | tee ../spike-configure.log
          echo "configure_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Summarize configure result
        if: always()
        run: |
          echo "### CMake configure" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -100 spike-configure.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "(no configure log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: CMake build (only if configure succeeded)
        id: cmakebuild
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          cmake --build runtime/build/shadps4-ios-arm64 --target shadps4_ios -j "$(sysctl -n hw.ncpu)" 2>&1 | tee spike-build.log
          echo "build_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarize build result
        if: always()
        run: |
          echo "### CMake build (target shadps4_ios)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error:|fatal error|ninja: build stopped|undefined symbol" spike-build.log 2>/dev/null | head -60 >> "$GITHUB_STEP_SUMMARY" || echo "(no build log — configure likely failed first)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Locate produced static libraries (diagnostic)
        if: always()
        run: |
          echo "--- .a files produced under runtime/build ---" | tee spike-libs-found.txt
          find runtime/build -name "*.a" 2>/dev/null | tee -a spike-libs-found.txt || true
          echo "--- .a files the Xcode project actually expects (from project.pbxproj) ---" >> spike-libs-found.txt
          grep -oE 'lib[A-Za-z0-9_-]+\.a' AetherPS4-iOS/AetherPS4-iOS.xcodeproj/project.pbxproj | sort -u >> spike-libs-found.txt
          cat spike-libs-found.txt

      - name: Build AetherPS4-iOS.xcodeproj (unsigned, matches runtime/scripts/build-ipa.sh)
        id: xcbuild
        continue-on-error: true
        run: |
          set -x
          cd AetherPS4-iOS
          xcodebuild \
            -project AetherPS4-iOS.xcodeproj \
            -scheme AetherPS4-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../spike-xcodebuild.log
          echo "xcbuild_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarize xcodebuild result
        if: always()
        run: |
          echo "### xcodebuild" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error:|BUILD FAILED|BUILD SUCCEEDED|Undefined symbol|library not found" spike-xcodebuild.log 2>/dev/null | head -80 >> "$GITHUB_STEP_SUMMARY" || echo "(no xcodebuild log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package unsigned IPA (only if xcodebuild succeeded)
        id: package
        if: steps.xcbuild.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          chmod +x runtime/scripts/build-ipa.sh
          ./runtime/scripts/build-ipa.sh "$PWD/ipa-out"
          ls -la ipa-out/

      - name: Upload ALL spike logs (always, whatever happened)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-spike-logs
          path: |
            spike-*.log
            spike-*.txt
          if-no-files-found: warn

      - name: Upload unsigned IPA (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AetherPS4-iOS-unsigned-ipa
          path: ipa-out/*.ipa
          if-no-files-found: warn
