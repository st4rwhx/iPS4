name: iOS build spike

# Second attempt, informed by real evidence from the first run (see git history
# for run 1's findings) plus a working reference pipeline for the same class of
# problem: margooey/Madeira-actions (Wine+FEX-Emu+DXMT on iOS) builds FEXCore,
# native libs, and links into an Xcode app via unsigned xcodebuild + zip, all
# with small, independent per-library scripts rather than one monolithic CMake
# super-build. This run validates the two highest-confidence, foundational
# pieces of that pattern before building on top of them in a follow-up:
#
#   1. Build runtime/sources/fexcore-darwin standalone (it has its own real
#      project(FEX C CXX ASM) CMakeLists.txt -- confirmed by direct read --
#      unlike the repo's own top-level CMakeLists.txt, which turned out to be
#      a misplaced duplicate of externals/CMakeLists.txt, not the real project
#      root; see run 1's CMake errors). BUILD_FEXCORE_ONLY=ON,
#      CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY (missing from run 1 --
#      without it CMake's compiler check tries to link an executable, which
#      doesn't work when cross-compiling to iOS).
#   2. Build externals/ (already content-correct for iOS per direct diff
#      against upstream shadps4-emu/shadPS4's externals/CMakeLists.txt --
#      just needs a tiny project()/cmake_minimum_required() wrapper it doesn't
#      have on its own) for spdlog/fmt/zlib/freetype/glslang/etc.
#
# NOT yet in this run, deliberately -- these depend on stages 1-2 actually
# succeeding first, and are more speculative (worth their own iteration once
# 1-2 are confirmed working, rather than compounding uncertainty in one shot):
#
#   3. Glob-build a shadps4_ios static library from src/, since the exact
#      curated file list the real (missing) root CMakeLists.txt would have
#      used isn't recoverable -- trading exact upstream parity for a
#      pragmatic working build. Would exclude src/platform/bachata
#      (Android-only) and define SHADPS4_ENABLE_FEX_GUEST_CPU.
#   4. xcodebuild (unsigned, CODE_SIGNING_ALLOWED=NO, matching
#      runtime/scripts/build-ipa.sh) against the now-portable .pbxproj (its
#      hardcoded /Users/davi/... absolute paths were fixed to $(SRCROOT)/..
#      in a separate commit) + package IPA.
#
# Still a spike: continue-on-error per stage, everything logged and uploaded
# regardless of where it stops, so a red run still hands back the exact next
# thing to fix. Also fixing a real bug from run 1: its "configure_exit"
# variable was captured but never acted on, so a genuinely failing CMake
# configure was reported as a successful step -- every configure/build step
# here now does `exit "${PIPESTATUS[0]}"` so a real failure actually fails
# the step (and, via continue-on-error, the job keeps going and still
# uploads logs -- but the step's own status is now honest).
#
# Update (attempt 6): the "misplaced duplicate" framing above for the root
# CMakeLists.txt turned out to be wrong, per direct confirmation from the
# upstream maintainer (checked their own git history): the 405-line file is
# the repo's actual, intentional, long-standing state -- there's a commit
# titled "Revert accidental CMakeLists.txt overwrite from the previous
# commit" where an earlier commit briefly copied the real ~1736-line root
# file (from a private downstream repo, Bachata-S4) over it by mistake, and
# that got caught and reverted the same day. The real build happens
# privately; its output .a files are copied into this repo's runtime/build/
# paths for Xcode to link against. There is no public "real root file" to
# restore -- stages 3-4 above (globbing a shadps4_ios target from src/) are
# therefore not a stopgap for a temporarily-missing file, they're the only
# way to get a from-source build out of the public repo at all.
#
# That also explains why attempt 5's externals build only produced
# pugixml.a: externals/CMakeLists.txt:6-8 sets EXCLUDE_FROM_ALL ON for its
# whole directory (inherited by every add_subdirectory() under it), on the
# assumption that a real consumer target's target_link_libraries() would
# pull in what it actually needs. We don't have that consumer yet (stage 3),
# so this attempt adds a forcing target in the wrapper that walks the
# externals/ directory tree for every real CMake target and add_dependencies()
# onto it directly -- exclusion only opts a target out of being a *root* of
# the default build, not out of being pulled in as a dependency.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write

env:
  IOS_DEPLOYMENT_TARGET: "18.0"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ImGuiFileDialog is submoduled from shadexternals/ImGuiFileDialog, which we don't have
      # push access to, so the fix can't live as a submodule commit -- same situation as SDL3's
      # Winlator patch (runtime/patches/sdl3-winlator-x11.patch, applied the identical way by
      # runtime/scripts/build-shadps4-arm64.sh) and FEXCore's fex-fexcore-only.patch. Confirmed
      # by attempt 6's actual build log (spike-externals-build.log): CreateDirectoryIfNotExist's
      # _IGFD_UNIX_ branch calls std::system("mkdir -p ..."), which Xcode's iphoneos SDK marks
      # explicitly unavailable (iOS is sandboxed, no process spawning) -- a hard compile error,
      # not a warning, so externals/ can never fully build for iOS without this.
      - name: Patch ImGuiFileDialog for iOS (no std::system)
        run: |
          set -x
          patch_path="$PWD/runtime/patches/imguifiledialog-ios-mkdir.patch"
          if git -C externals/ImGuiFileDialog apply --check "$patch_path" 2>/dev/null; then
            git -C externals/ImGuiFileDialog apply "$patch_path"
          elif git -C externals/ImGuiFileDialog apply --reverse --check "$patch_path" 2>/dev/null; then
            echo "ImGuiFileDialog iOS patch already applied, skipping"
          else
            echo "::error::ImGuiFileDialog iOS patch does not apply cleanly"
            exit 1
          fi

      # Self-inflicted, found by attempt 17's own build log: wiring IMGUI_USER_CONFIG into
      # Dear_ImGui (to fix real ABI issues, see the shadps4_ios patch history) means imgui.h no
      # longer defines its own IM_ASSERT, so it also stops transitively #include'ing <cassert>
      # on ImGuiFileDialog.cpp's behalf -- and this file uses the raw assert() macro directly
      # without including <cassert> itself. Confirmed via direct build log read ("use of
      # undeclared identifier 'assert'") and confirmed no other externals/ or src/ file has the
      # same latent gap (grepped every file that includes imgui.h for bare assert() calls
      # without their own <cassert>/<assert.h>).
      - name: Patch ImGuiFileDialog for missing <cassert> (IMGUI_USER_CONFIG side effect)
        run: |
          set -x
          patch_path="$PWD/runtime/patches/imguifiledialog-cassert.patch"
          if git -C externals/ImGuiFileDialog apply --check "$patch_path" 2>/dev/null; then
            git -C externals/ImGuiFileDialog apply "$patch_path"
          elif git -C externals/ImGuiFileDialog apply --reverse --check "$patch_path" 2>/dev/null; then
            echo "ImGuiFileDialog cassert patch already applied, skipping"
          else
            echo "::error::ImGuiFileDialog cassert patch does not apply cleanly"
            exit 1
          fi

      # Same situation, same fix pattern, one error later: attempt 7's build log
      # (spike-externals-build.log) shows the build reached 82% (1100/1347 steps) past the
      # ImGuiFileDialog fix before hwinfo_battery's apple/battery.cpp hit
      # "fatal error: 'IOKit/ps/IOPSKeys.h' file not found" -- confirmed root cause by reading
      # externals/hwinfo/include/hwinfo/platform.h: HWINFO_APPLE is defined for any __APPLE__
      # target, which fires for iOS too (Apple's toolchain still sets __APPLE__ there), but
      # IOKit's Power Source API is genuinely macOS-only. libhwinfo_battery.a (like the other
      # hwinfo_* libs) is a real dependency confirmed in AetherPS4-iOS.xcodeproj's own library
      # list, so it can't just be skipped. externals/hwinfo tracks shadps4-emu/ext-hwinfo,
      # another repo we don't have push access to -- same patch-file approach as
      # ImGuiFileDialog above.
      - name: Patch hwinfo battery module for iOS (no macOS-only IOKit power API)
        run: |
          set -x
          patch_path="$PWD/runtime/patches/hwinfo-battery-ios.patch"
          if git -C externals/hwinfo apply --check "$patch_path" 2>/dev/null; then
            git -C externals/hwinfo apply "$patch_path"
          elif git -C externals/hwinfo apply --reverse --check "$patch_path" 2>/dev/null; then
            echo "hwinfo battery iOS patch already applied, skipping"
          else
            echo "::error::hwinfo battery iOS patch does not apply cleanly"
            exit 1
          fi

      # Same family, next module: attempt 8's build log shows battery.cpp AND cpu.cpp both
      # compiled clean (confirming the battery patch worked, and that cpu.cpp's own apple/*.cpp
      # files don't touch IOKit at all -- grepped, only sysctl-family calls there, which do work
      # on iOS) before hwinfo_disk's apple/disk.cpp hit "fatal error: 'IOKit/IOBSD.h' file not
      # found". Same root cause (HWINFO_APPLE not distinguishing iOS from macOS), same fix
      # shape: iOS's sandbox has no raw block-device/BSD-disk enumeration API at all (unlike
      # battery.cpp's IOKit calls, there isn't even a UIKit-level substitute), so this stubs
      # getAllDisks() to an empty list rather than porting anything.
      - name: Patch hwinfo disk module for iOS (no macOS-only IOKit storage API)
        run: |
          set -x
          patch_path="$PWD/runtime/patches/hwinfo-disk-ios.patch"
          if git -C externals/hwinfo apply --check "$patch_path" 2>/dev/null; then
            git -C externals/hwinfo apply "$patch_path"
          elif git -C externals/hwinfo apply --reverse --check "$patch_path" 2>/dev/null; then
            echo "hwinfo disk iOS patch already applied, skipping"
          else
            echo "::error::hwinfo disk iOS patch does not apply cleanly"
            exit 1
          fi

      # Attempt 9 resolved the ambiguity flagged in that commit: mainboard.cpp DOES fail to
      # compile on iOS -- confirmed by direct read of spike-externals-build.log -- just with a
      # different error shape than battery/disk's "file not found": IOKitLib.h itself exists on
      # iOS, but kIOMasterPortDefault is explicitly marked unavailable there ("'kIOMasterPortDefault'
      # is unavailable: not available on iOS"), a hard compile error, not a silent runtime no-op.
      # disk.cpp's patch worked cleanly in the same run (zero errors from it). Same fix shape as
      # the other two: there's no sandboxed-app-reachable equivalent of the
      # "IOPlatformExpertDevice" registry lookup this file needs, so the iOS stub returns
      # "<unknown>" for the serial number too, matching the three fields this file's own real
      # Apple implementation already hardcodes to "<unknown>" regardless of platform.
      - name: Patch hwinfo mainboard module for iOS (kIOMasterPortDefault unavailable)
        run: |
          set -x
          patch_path="$PWD/runtime/patches/hwinfo-mainboard-ios.patch"
          if git -C externals/hwinfo apply --check "$patch_path" 2>/dev/null; then
            git -C externals/hwinfo apply "$patch_path"
          elif git -C externals/hwinfo apply --reverse --check "$patch_path" 2>/dev/null; then
            echo "hwinfo mainboard iOS patch already applied, skipping"
          else
            echo "::error::hwinfo mainboard iOS patch does not apply cleanly"
            exit 1
          fi

      - name: Show runner environment
        run: |
          sw_vers || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          cmake --version || true

      - name: Install build tools
        run: |
          brew update || true
          for i in 1 2 3; do
            brew install ninja && break
            echo "brew install attempt $i failed; retrying in $((i*5))s"; sleep $((i*5))
          done
          command -v ninja >/dev/null || { echo "::error::ninja missing after retries"; exit 1; }

      # ==============================================================
      # STAGE 1: FEXCore, standalone. Flags mirror Madeira-actions'
      # working FEX build (margooey/Madeira-actions/.github/workflows/main.yml)
      # as closely as this fork's own runtime/sources/fexcore-darwin/CMakeLists.txt
      # options allow (it exposes the same BUILD_FEXCORE_ONLY option Madeira's
      # FEX fork does, plus FEXCORE_PROJECT_SOURCE_DIR/FEXCORE_GUEST_HARNESS_SOURCES
      # for embedding this app's own guest-CPU bridge, per its own README).
      # ==============================================================
      - name: Configure FEXCore (standalone)
        id: fexconfigure
        continue-on-error: true
        run: |
          set -x
          cmake -S runtime/sources/fexcore-darwin -B runtime/build/fexcore-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DBUILD_FEXCORE_ONLY=ON \
            -DFEXCORE_SMOKE_SOURCE="$PWD/runtime/probes/fexcore-smoke.cpp" \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DENABLE_GDB_SYMBOLS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEXCORE_PROFILER=OFF \
            -DTUNE_CPU=none \
            2>&1 | tee spike-fex-configure.log
          exit "${PIPESTATUS[0]}"

      # Common/CommonTools/JemallocLibs are EXCLUDE_FROM_ALL under BUILD_FEXCORE_ONLY (same
      # reason as externals/'s own EXCLUDE_FROM_ALL, see Stage 2) so building only
      # FEXCore/FEXCore_Base never touched them. AetherPS4-iOS.xcodeproj's own library list
      # references libcpp-optparse.a, librpmalloc.a, libcephes_128bit.a, libtiny-json.a,
      # libJemallocLibs.a -- confirmed by reading this repo's own Source/Common/CMakeLists.txt
      # (Common links cpp-optparse + tiny-json::tiny-json directly) and
      # FEXCore/Source/CMakeLists.txt (JemallocLibs links rpmalloc when
      # ENABLE_JEMALLOC_GLIBC_ALLOC=OFF, which this workflow already sets; FEXCore's own LIBS
      # already includes cephes_128bit) that these are FEXCore's own vendored dependencies, not
      # something externals/ or shadps4_ios's own sources provide. Building Common/CommonTools/
      # JemallocLibs directly (rather than the fexcore-smoke executable that pulls them in --
      # that's an iOS executable link, a separate, unnecessary risk to take on here) forces
      # CMake's dependency graph to build the whole vendored closure without needing to name
      # rpmalloc/cephes_128bit/tiny-json/cpp-optparse individually.
      - name: Build FEXCore
        id: fexbuild
        if: steps.fexconfigure.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          cmake --build runtime/build/fexcore-ios \
            --target FEXCore FEXCore_Base Common CommonTools JemallocLibs \
            --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee spike-fex-build.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize FEXCore stage
        if: always()
        run: |
          echo "### FEXCore (standalone)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 spike-fex-configure.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "error:|FAILED" spike-fex-build.log 2>/dev/null | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find runtime/build/fexcore-ios -name "*.a" 2>/dev/null | sort | tee spike-fex-libs.txt

      # ==============================================================
      # STAGE 2: externals/ (spdlog, fmt, zlib, freetype, glslang, openal,
      # etc.) -- content-correct for iOS already (confirmed by diff against
      # upstream shadps4-emu/shadPS4's externals/CMakeLists.txt), just needs
      # a real project() it doesn't have on its own account of being an
      # add_subdirectory()-only file.
      # ==============================================================
      - name: Wrap externals/ with a real project()
        run: |
          mkdir -p spike-wrapper
          cat > spike-wrapper/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(shadps4_ios_externals CXX C ASM)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED True)
          set(ENABLE_DISCORD_RPC OFF CACHE BOOL "" FORCE)
          set(ENABLE_TESTS OFF CACHE BOOL "" FORCE)
          set(ENABLE_UPDATER OFF CACHE BOOL "" FORCE)
          # externals/ffmpeg-core/CMakeLists.txt reads ARCHITECTURE, which upstream
          # shadps4-emu/shadPS4's real root CMakeLists.txt computes (from
          # CMAKE_OSX_ARCHITECTURES/CMAKE_SYSTEM_PROCESSOR) before add_subdirectory
          # (externals) -- this wrapper is standing in for that missing root file,
          # so it needs to set the same variable the same way. iOS is always arm64
          # here, so the general detection logic isn't needed, just the result.
          set(ARCHITECTURE "arm64")
          # externals/CMakeLists.txt uses relative add_subdirectory() calls (e.g.
          # add_subdirectory(spdlog)) resolved against ITS OWN directory, not the
          # wrapper's -- add_subdirectory (not include()) is what makes CMake
          # resolve those correctly, since it changes CMAKE_CURRENT_SOURCE_DIR.
          add_subdirectory("${CMAKE_CURRENT_SOURCE_DIR}/../externals" externals-build)

          # externals/CMakeLists.txt:6-8 does
          #   set_directory_properties(PROPERTIES EXCLUDE_FROM_ALL ON SYSTEM ON)
          # which makes EXCLUDE_FROM_ALL the inherited default for every
          # add_subdirectory() underneath it (confirmed by direct read) --
          # i.e. essentially every library target in the whole externals/
          # tree (spdlog, fmt, zlib-ng, freetype, glslang, openal-soft, ...)
          # is excluded from the default `all` target unless something pulls
          # it in via a real dependency edge. Normally that puller is the
          # real shadps4_ios/shadPS4 target's target_link_libraries(), which
          # doesn't exist in this repo (see the CMake-gap note at the top of
          # this workflow). Confirmed by evidence, not guesswork: run 5's
          # build log showed only pugixml's 3 ninja steps ran, even though
          # configure succeeded cleanly for the whole tree.
          #
          # Rather than hand-enumerate every real CMake target name (which
          # can differ from the .a filename, e.g. zlib-ng's is "zlibstatic"),
          # walk the directory tree CMake already built and force a
          # dependency edge onto every buildable target it finds. A target
          # marked EXCLUDE_FROM_ALL still builds if something depends on it
          # via add_dependencies() -- exclusion only opts a target out of
          # being a *root* of the default build, not out of being pulled in
          # as a dependency of one.
          function(collect_targets_recursive out_var dir)
            set(_found)
            get_property(_subdirs DIRECTORY "${dir}" PROPERTY SUBDIRECTORIES)
            foreach(_subdir IN LISTS _subdirs)
              collect_targets_recursive(_sub_found "${_subdir}")
              list(APPEND _found ${_sub_found})
            endforeach()
            get_property(_dir_targets DIRECTORY "${dir}" PROPERTY BUILDSYSTEM_TARGETS)
            list(APPEND _found ${_dir_targets})
            set(${out_var} ${_found} PARENT_SCOPE)
          endfunction()

          collect_targets_recursive(_externals_targets "${CMAKE_CURRENT_SOURCE_DIR}/../externals")
          add_custom_target(build_all_externals ALL)
          foreach(_t IN LISTS _externals_targets)
            if(TARGET ${_t})
              get_target_property(_t_type ${_t} TYPE)
              if(_t_type MATCHES "^(STATIC_LIBRARY|SHARED_LIBRARY|MODULE_LIBRARY|OBJECT_LIBRARY|EXECUTABLE)$")
                add_dependencies(build_all_externals ${_t})
              endif()
            endif()
          endforeach()
          EOF

      - name: Configure externals
        id: extconfigure
        continue-on-error: true
        run: |
          set -x
          cmake -S spike-wrapper -B runtime/build/shadps4-ios/externals -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE=1 \
            -DALLOWS_ONESHOT_TIMERS_WITH_TIMEOUT_ZERO_EXITCODE__TRYRUN_OUTPUT= \
            2>&1 | tee spike-externals-configure.log
          exit "${PIPESTATUS[0]}"

      - name: Build externals
        id: extbuild
        if: steps.extconfigure.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          cmake --build runtime/build/shadps4-ios/externals \
            --target build_all_externals \
            --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee spike-externals-build.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize externals stage
        if: always()
        run: |
          echo "### externals/" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 spike-externals-configure.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "error:|FAILED" spike-externals-build.log 2>/dev/null | head -100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find runtime/build/shadps4-ios/externals -name "*.a" 2>/dev/null | sort | tee spike-externals-libs.txt

      # ==============================================================
      # STAGE 3: shadps4_ios itself, globbed from src/ -- confirmed (see this
      # workflow's history and the upstream maintainer's own confirmation) that
      # there is no public "real" root CMakeLists.txt with a curated source-file
      # list to restore; globbing is the only way to get a from-source build out
      # of this public repo. Two things need solving before the glob itself:
      #
      #   1. src/imgui/renderer has its own real CMakeLists.txt (ImGui_Resources)
      #      that embeds font files into C++ source via a HOST-native helper
      #      executable run *during* the build (Dear_ImGui_FontEmbed) -- can't
      #      execute an iOS binary on the CI host, so that helper has to be built
      #      natively (no cross-compile flags) in a separate pass first.
      #   2. src/video_core/host_shaders has its own real CMakeLists.txt
      #      (host_shaders) that generates C++ headers from GLSL shader source via
      #      a plain `cmake -P` script (StringShaderHeader.cmake) -- no execution
      #      of target-arch code involved, so this one is already cross-compile-
      #      safe as-is, just needs add_subdirectory()'d like ImGui_Resources.
      #
      # Everything else under src/ is flat-globbed. src/platform/bachata was
      # wrongly assumed Android-only in this workflow's original header comment
      # (corrected after actually reading it: it's POSIX Unix-domain-socket IPC,
      # no Android/JNI code at all, and main.cpp uses it unconditionally with no
      # platform guard) -- it stays in the glob.
      # ==============================================================
      - name: Build host tool Dear_ImGui_FontEmbed (native, not cross-compiled)
        id: fontembedbuild
        continue-on-error: true
        run: |
          set -x
          mkdir -p runtime/build/host-tools
          clang++ -O2 -std=c++17 \
            externals/dear_imgui/misc/fonts/binary_to_compressed_c.cpp \
            -o runtime/build/host-tools/Dear_ImGui_FontEmbed \
            2>&1 | tee spike-fontembed-build.log
          exit "${PIPESTATUS[0]}"

      - name: Add shadps4_ios target to wrapper
        if: steps.fontembedbuild.outcome == 'success' && steps.extconfigure.outcome == 'success'
        run: |
          cat >> spike-wrapper/CMakeLists.txt << 'EOF'

          set(IMGUI_FONT_EMBED_EXECUTABLE
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/build/host-tools/Dear_ImGui_FontEmbed"
              CACHE FILEPATH "" FORCE)
          add_subdirectory("${CMAKE_CURRENT_SOURCE_DIR}/../src/imgui/renderer" imgui-renderer-build)
          add_subdirectory("${CMAKE_CURRENT_SOURCE_DIR}/../src/video_core/host_shaders" host-shaders-build)

          # src/imgui/renderer/ holds both real, hand-written source (font_data.cpp,
          # texture_manager.cpp, imgui_core.cpp, imgui_impl_sdl3.cpp, imgui_impl_vulkan.cpp,
          # font_stack.cpp -- confirmed by directory listing) AND its own CMakeLists.txt
          # (ImGui_Resources, added above) that builds ONLY the generated font-embed .cpp files
          # into ${CMAKE_CURRENT_BINARY_DIR}/generated_fonts -- the BUILD tree, not the source
          # tree, so this source-tree glob never sees them and needs no exclusion for that
          # directory: the hand-written files here are genuinely meant to compile straight into
          # shadps4_ios like everything else under src/.
          file(GLOB_RECURSE SHADPS4_IOS_SOURCES CONFIGURE_DEPENDS
               "${CMAKE_CURRENT_SOURCE_DIR}/../src/*.cpp"
               "${CMAKE_CURRENT_SOURCE_DIR}/../src/*.mm")

          add_library(shadps4_ios STATIC ${SHADPS4_IOS_SOURCES})
          add_dependencies(shadps4_ios host_shaders)
          target_compile_features(shadps4_ios PUBLIC cxx_std_23)
          # This app's entire premise is the FEX-based x86-64 guest CPU bridge; without this
          # define, src/core/fex, src/core/linker.h, src/main.cpp, and others compile out the
          # guest-CPU integration entirely (confirmed by direct read -- every one of those
          # files gates real functionality behind #ifdef SHADPS4_ENABLE_FEX_GUEST_CPU).
          target_compile_definitions(shadps4_ios PRIVATE SHADPS4_ENABLE_FEX_GUEST_CPU)
          target_include_directories(shadps4_ios PUBLIC
              "${CMAKE_CURRENT_SOURCE_DIR}/../src"
              "${IMGUI_RESOURCES_INCLUDE}"
              "${HOST_SHADERS_INCLUDE}"
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/sources/fexcore-darwin/FEXCore/include"
              # FEXCore's own root CMakeLists.txt does include_directories(Source/) and
              # include_directories("${CMAKE_BINARY_DIR}/Source/") globally for every target in
              # that project -- Common/Config.h (used by core/fex/fex_guest_engine.cpp) lives
              # under Source/Common/, not the public FEXCore/include tree above, so the same two
              # roots need to be on our own path too.
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/sources/fexcore-darwin/Source"
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/build/fexcore-ios/Source"
              # Same situation, one directory tree over: the FEXCore target itself (defined in
              # FEXCore/Source/CMakeLists.txt) does target_include_directories(FEXCore PRIVATE
              # ${CMAKE_CURRENT_SOURCE_DIR}/) for ITS OWN sources -- private to that target, not
              # exported via FEXCore/include/. core/fex/fex_guest_engine.cpp reaches into
              # FEXCore's internals directly (Interface/Context/Context.h,
              # Interface/Core/LookupCache.h) for the deep guest-CPU integration this app needs
              # beyond FEXCore's public API, so it needs the same private root FEXCore's own
              # sources use.
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/sources/fexcore-darwin/FEXCore/Source"
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/build/fexcore-ios/FEXCore/Source"
              # FEXCore/Config/Config.h (reached transitively via Common/Config.h) itself
              # #include <FEXCore/Config/ConfigValues.inl> -- a file FEXCore/Source/CMakeLists.txt
              # generates at build time (config_generator.py) into
              # ${CMAKE_BINARY_DIR}/include/FEXCore/Config/, i.e. this FEXCore build's own
              # include/ tree, not its source tree at all. Stage 1 already produces this as a
              # side effect of building FEXCore itself (confirmed: FEXCore.a already builds
              # clean), so it already exists -- just needed on our own include path too.
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/build/fexcore-ios/include"
              # FEXCore/fextl/robin_map.h (FEXCore's own STL-like container library, pulled in
              # transitively via FEXCore/Core/Context.h -> FEXCore/Core/CodeCache.h) needs
              # ankerl::unordered_dense -- FEXCore's own vendored copy at
              # External/unordered_dense/include, added via the top-level fexcore-darwin
              # CMakeLists.txt's add_subdirectory(External/unordered_dense) and PUBLIC-linked
              # into the real FEXCore target there. We link FEXCore by raw .a path rather than
              # as a real CMake target, so that PUBLIC include propagation never reaches us --
              # same situation as every other FEXCore-internal path added above.
              "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/sources/fexcore-darwin/External/unordered_dense/include"
          )

          # FEXCore (Stage 1) is a separate CMake project's build output, not a target visible
          # in this project -- linked here by direct .a path. Deliberately excludes FEXCore's
          # own External/fmt and External/xxhash copies: externals/ (Stage 2) already provides
          # fmt::fmt and xxHash::xxhash, and linking both copies would duplicate-symbol at link
          # time.
          set(FEXCORE_BUILD_DIR "${CMAKE_CURRENT_SOURCE_DIR}/../runtime/build/fexcore-ios")
          target_link_libraries(shadps4_ios PUBLIC
              "${FEXCORE_BUILD_DIR}/FEXCore/Source/libFEXCore.a"
              "${FEXCORE_BUILD_DIR}/FEXCore/Source/libFEXCore_Base.a"
              "${FEXCORE_BUILD_DIR}/FEXCore/Source/libJemallocLibs.a"
              "${FEXCORE_BUILD_DIR}/Source/Common/libCommon.a"
              "${FEXCORE_BUILD_DIR}/Source/Tools/CommonTools/libCommonTools.a"
              "${FEXCORE_BUILD_DIR}/Source/Common/cpp-optparse/libcpp-optparse.a"
              "${FEXCORE_BUILD_DIR}/External/rpmalloc/librpmalloc.a"
              "${FEXCORE_BUILD_DIR}/External/cephes/libcephes_128bit.a"
              "${FEXCORE_BUILD_DIR}/External/SoftFloat-3e/libsoftfloat_3e.a"
              "${FEXCORE_BUILD_DIR}/External/tiny-json/libtiny-json.a"
          )

          # externals/ (Stage 2) targets -- every name below confirmed by direct read of the
          # relevant submodule's own CMakeLists.txt (not guessed from .a filenames, which can
          # differ from the real CMake target name -- e.g. pugixml's real static target is
          # "pugixml-static"/"pugixml::static", not the INTERFACE target "pugixml").
          target_link_libraries(shadps4_ios PUBLIC
              ImGui_Resources
              fmt::fmt
              ZLIB::ZLIB
              Freetype::Freetype
              FFmpeg::ffmpeg
              PNG::PNG
              xxHash::xxhash
              miniz::miniz
              spdlog::spdlog
              SDL3::SDL3
              glslang SPIRV GenericCodeGen MachineIndependent OSDependent glslang-default-resource-limits
              Zydis::Zydis
              Zycore::Zycore
              OpenAL::OpenAL
              pugixml::static
              crypto ssl tls
              date::date-tz
              LibAtrac9
              sirit
              TracyClient
              Dear_ImGui
              ImGuiFileDialog
              miniupnpc::miniupnpc
              hwinfo_battery hwinfo_cpu hwinfo_disk hwinfo_gpu hwinfo_mainboard
              hwinfo_network hwinfo_os hwinfo_ram
              nlohmann_json::nlohmann_json
              RenderDoc::API
              half::half
              stb::headers
              minimp3
              Cpp_Httplib
              toml11::toml11
              Boost::headers
              Vulkan::Headers
              GPUOpen::VulkanMemoryAllocator
              tsl::robin_map
              xbyak::xbyak
              magic_enum::magic_enum
              epoll-shim
              fdk-aac
              CLI11::CLI11
              gcn
          )
          EOF

      - name: Build shadps4_ios (Stage 3)
        id: shadps4iosbuild
        if: steps.fontembedbuild.outcome == 'success' && steps.extconfigure.outcome == 'success'
        continue-on-error: true
        run: |
          set -x
          cmake --build runtime/build/shadps4-ios/externals --target shadps4_ios \
            --parallel "$(sysctl -n hw.ncpu)" 2>&1 | tee spike-shadps4ios-build.log
          exit "${PIPESTATUS[0]}"

      - name: Summarize shadps4_ios stage
        if: always()
        run: |
          echo "### shadps4_ios" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -30 spike-fontembed-build.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          grep -iE "error:|FAILED" spike-shadps4ios-build.log 2>/dev/null | head -150 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find runtime/build/shadps4-ios/externals -name "libshadps4_ios.a" 2>/dev/null | tee spike-shadps4ios-libs.txt

      - name: Upload ALL spike logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-spike-logs
          path: |
            spike-*.log
            spike-*.txt
          if-no-files-found: warn

      - name: Upload FEXCore libs (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fexcore-ios-libs
          path: |
            runtime/build/fexcore-ios/**/*.a
          if-no-files-found: warn
